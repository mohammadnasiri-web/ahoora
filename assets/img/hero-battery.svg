<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" fill="none">
  <defs>
    <linearGradient id="bodyL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e5e5ea"/>
    </linearGradient>
    <linearGradient id="bodyR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="screenL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ac8fa"/>
      <stop offset="55%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>
    <linearGradient id="screenR" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ff9f0a"/>
      <stop offset="45%" stop-color="#ff375f"/>
      <stop offset="100%" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d2d2d7"/>
    </linearGradient>
    <linearGradient id="mesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7c7cc"/>
      <stop offset="100%" stop-color="#8e8e93"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#1d1d1f" flood-opacity="0.18"/>
    </filter>
    <filter id="soft2" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1d1d1f" flood-opacity="0.16"/>
    </filter>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.9" fill="#8e8e93" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="550" cy="575" rx="340" ry="22" fill="#1d1d1f" opacity="0.08"/>

  <!-- Left device (white) -->
  <g filter="url(#soft)">
    <ellipse cx="360" cy="520" rx="92" ry="18" fill="#1d1d1f" opacity="0.08"/>
    <rect x="286" y="430" width="148" height="90" rx="74" fill="url(#base)"/>
    <rect x="298" y="442" width="124" height="66" rx="60" fill="url(#mesh)"/>
    <rect x="298" y="442" width="124" height="66" rx="60" fill="url(#dots)" opacity="0.55"/>
    <rect x="318" y="118" width="84" height="330" rx="18" fill="#d1d1d6"/>
    <rect x="268" y="78" width="184" height="240" rx="28" fill="url(#bodyL)" stroke="#d2d2d7" stroke-width="2"/>
    <rect x="282" y="96" width="156" height="204" rx="16" fill="url(#screenL)"/>
    <!-- widgets -->
    <rect x="298" y="118" width="72" height="56" rx="14" fill="#fff" opacity="0.92"/>
    <text x="334" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#1d1d1f">۹:۴۱</text>
    <rect x="380" y="118" width="42" height="56" rx="12" fill="#fff" opacity="0.85"/>
    <circle cx="401" cy="138" r="10" fill="#34c759"/>
    <rect x="298" y="186" width="124" height="90" rx="16" fill="#fff" opacity="0.88"/>
    <rect x="312" y="204" width="48" height="8" rx="4" fill="#007aff" opacity="0.85"/>
    <rect x="312" y="222" width="96" height="6" rx="3" fill="#c7c7cc"/>
    <rect x="312" y="238" width="72" height="6" rx="3" fill="#c7c7cc"/>
  </g>

  <!-- Right device (dark) -->
  <g filter="url(#soft2)">
    <ellipse cx="730" cy="530" rx="100" ry="18" fill="#1d1d1f" opacity="0.1"/>
    <rect x="646" y="436" width="168" height="98" rx="84" fill="url(#base)"/>
    <rect x="660" y="450" width="140" height="70" rx="64" fill="url(#mesh)"/>
    <rect x="660" y="450" width="140" height="70" rx="64" fill="url(#dots)" opacity="0.55"/>
    <rect x="688" y="108" width="84" height="350" rx="18" fill="#aeaeb2"/>
    <rect x="632" y="58" width="196" height="268" rx="32" fill="url(#bodyR)"/>
    <rect x="648" y="78" width="164" height="228" rx="18" fill="url(#screenR)"/>
    <circle cx="730" cy="118" r="18" fill="#fff" opacity="0.25"/>
    <rect x="678" y="160" width="104" height="14" rx="7" fill="#fff" opacity="0.9"/>
    <rect x="698" y="190" width="64" height="8" rx="4" fill="#fff" opacity="0.55"/>
    <rect x="668" y="230" width="124" height="48" rx="14" fill="#fff" opacity="0.18"/>
  </g>
</svg>
