<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>گوشی موبایل و تجهیزات | اهورا تل</title>
  <meta name="description" content="خرید گوشی موبایل، لوازم جانبی و قطعات موبایل با گارانتی از اهورا تل">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>
  <div id="ah-header"></div>
  <div id="ah-promo"></div>
  <main class="ah-cat-page container-ah">
    <nav class="ah-cat-crumb" id="catCrumb" aria-label="مسیر صفحه"></nav>
    <h1 class="ah-cat-title">گوشی موبایل و تجهیزات</h1>
    <div class="ah-cat-subs" id="catSubs"></div>

    <div class="ah-cat-layout">
      <div class="ah-cat-sheet-overlay" id="catOverlay" hidden></div>

      <aside class="ah-cat-filters" id="catFilters" aria-label="فیلترها">
        <div class="ah-cat-filters-head">
          <span><i class="bi bi-sliders" aria-hidden="true"></i> فیلترها</span>
          <button type="button" class="ah-cat-clear" id="catClear" hidden>حذف فیلترها</button>
          <button type="button" class="ah-cat-sheet-close" data-close-sheet aria-label="بستن"><i class="bi bi-x-lg"></i></button>
        </div>
        <label class="ah-cat-switch">
          <span>فقط کالاهای موجود</span>
          <input type="checkbox" id="catInStock">
          <span class="ah-cat-switch-ui" aria-hidden="true"></span>
        </label>
        <label class="ah-cat-switch">
          <span>فقط کالاهای تخفیف‌دار</span>
          <input type="checkbox" id="catDiscount">
          <span class="ah-cat-switch-ui" aria-hidden="true"></span>
        </label>
        <details class="ah-cat-acc">
          <summary>فیلتر براساس قیمت <i class="bi bi-chevron-down" aria-hidden="true"></i></summary>
          <div class="ah-cat-price">
            <label>از <input type="number" inputmode="numeric" min="0" id="catMin" placeholder="۰"> تومان</label>
            <label>تا <input type="number" inputmode="numeric" min="0" id="catMax" placeholder="بدون سقف"> تومان</label>
          </div>
        </details>
        <details class="ah-cat-acc">
          <summary>دسته بندی ها <i class="bi bi-chevron-down" aria-hidden="true"></i></summary>
          <div class="ah-cat-checks" id="catCatList"></div>
        </details>
        <details class="ah-cat-acc">
          <summary>برندها <i class="bi bi-chevron-down" aria-hidden="true"></i></summary>
          <div class="ah-cat-checks" id="catBrandList"></div>
        </details>
        <button type="button" class="ah-cat-sheet-apply" data-close-sheet id="catApply">نمایش کالاها</button>
      </aside>

      <section class="ah-cat-main">
        <div class="ah-cat-toolbar">
          <div class="ah-cat-sort" id="catSort">
            <span class="ah-cat-sort-label"><i class="bi bi-sort-down" aria-hidden="true"></i> ترتیب:</span>
          </div>
          <span class="ah-cat-count" id="catCount"></span>
        </div>

        <div class="ah-cat-mbar">
          <button type="button" id="catOpenFilters"><i class="bi bi-sliders" aria-hidden="true"></i> فیلترها <span class="ah-cat-dot" id="catFilterDot" hidden></span></button>
          <button type="button" id="catOpenSort"><i class="bi bi-sort-down" aria-hidden="true"></i> ترتیب : <span id="catSortCurrent"></span></button>
        </div>
        <p class="ah-cat-mcount" id="catMCount"></p>

        <div class="ah-cat-sortsheet" id="catSortSheet" aria-label="ترتیب">
          <div class="ah-cat-filters-head">
            <span>ترتیب نمایش</span>
            <button type="button" class="ah-cat-sheet-close" data-close-sheet aria-label="بستن"><i class="bi bi-x-lg"></i></button>
          </div>
          <div id="catSortList"></div>
        </div>

        <div class="ah-cat-grid" id="catGrid"></div>
      </section>
    </div>
  </main>
  <div id="ah-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/chatbot.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/category.js"></script>
</body>
</html>
