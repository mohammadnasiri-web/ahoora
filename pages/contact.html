<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تماس با ما | اهورا تل</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>
  <div id="ah-header"></div>
  <main class="container-ah py-5" id="pageRoot"></main>
  <div id="ah-footer"></div>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/chatbot.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await AhooraLayout.boot();
      const site = AhooraStore.site.get();
      const p = site.pages.contact;
      AhooraUtils.setMeta({ title: p.seoTitle, description: p.seoDescription });
      document.getElementById("pageRoot").innerHTML = `
        <div class="row g-4">
          <div class="col-md-6">
            <h1 class="mb-3">${p.title}</h1>
            <p>${site.site.address}</p>
            <p>تلفن: <a href="tel:${site.site.phone}" dir="ltr">${site.site.phone}</a></p>
            <p>واتساپ: <a href="https://wa.me/${site.site.whatsapp}" dir="ltr">+${site.site.whatsapp}</a></p>
            <p>ایمیل: <a href="mailto:${site.site.email}">${site.site.email}</a></p>
            <p>${site.site.workingHours}</p>
          </div>
          <div class="col-md-6">
            <form class="ah-form-card" onsubmit="event.preventDefault();AhooraUtils.toast('پیام شما ثبت شد (دمو)');this.reset();">
              <h2 class="h5 mb-3">ارسال پیام</h2>
              <input class="form-control mb-2" placeholder="نام" required>
              <input class="form-control mb-2" placeholder="شماره تماس" required>
              <textarea class="form-control mb-3" rows="4" placeholder="پیام" required></textarea>
              <button class="ah-btn ah-btn-primary" type="submit">ارسال</button>
            </form>
          </div>
        </div>`;
      AhooraUtils.injectSchema({
        "@context":"https://schema.org","@type":"ContactPage",
        mainEntity:{ "@type":"LocalBusiness", name:site.site.name, telephone:site.site.phone, email:site.site.email, address:site.site.address }
      });
    });
  </script>
</body>
</html>
