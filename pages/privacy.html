<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حریم خصوصی | اهورا تل</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>
  <div id="ah-header"></div>
  <main class="container-ah py-5" id="pageRoot" style="max-width:760px"></main>
  <div id="ah-footer"></div>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/chatbot.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await AhooraLayout.boot();
      const p = AhooraStore.site.get().pages.privacy;
      AhooraUtils.setMeta({ title: p.seoTitle, description: p.seoDescription });
      document.getElementById("pageRoot").innerHTML = `<h1>${p.title}</h1><p>${p.content}</p>`;
    });
  </script>
</body>
</html>
