<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سوالات متداول | اهورا تل</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>
  <div id="ah-header"></div>
  <header class="ah-page-hero"><div class="container-ah"><h1>سوالات متداول</h1></div></header>
  <main class="container-ah py-4" id="faqRoot" style="max-width:760px"></main>
  <div id="ah-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/chatbot.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await AhooraLayout.boot({ seo:{ title:"سوالات متداول | اهورا تل", description:"پاسخ سوالات رایج مشتریان اهورا تل" }});
      const faqs = (AhooraStore.content.get().faqs||[]).filter(f=>f.active).sort((a,b)=>a.order-b.order);
      document.getElementById("faqRoot").innerHTML = `<div class="accordion" id="faqAcc">${faqs.map((f,i)=>`
        <div class="accordion-item"><h2 class="accordion-header">
          <button class="accordion-button ${i?'collapsed':''}" type="button" data-bs-toggle="collapse" data-bs-target="#q${f.id}">${f.question}</button>
        </h2><div id="q${f.id}" class="accordion-collapse collapse ${i?'':'show'}" data-bs-parent="#faqAcc"><div class="accordion-body">${f.answer}</div></div></div>`).join("")}</div>`;
      AhooraUtils.injectSchema({
        "@context":"https://schema.org","@type":"FAQPage",
        mainEntity: faqs.map(f=>({ "@type":"Question", name:f.question, acceptedAnswer:{ "@type":"Answer", text:f.answer }}))
      });
    });
  </script>
</body>
</html>
