<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>رزرو نوبت | اهورا تل</title>
  <meta name="description" content="رزرو آنلاین تعویض باتری و خدمات تعمیرات با ظرفیت روزانه قابل مدیریت">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>
  <div id="ah-header"></div>
  <header class="ah-page-hero">
    <div class="container-ah">
      <h1>ثبت درخواست</h1>
      <p>اول مدل گوشی، بعد نوع کار، و در آخر اطلاعات شما.</p>
    </div>
  </header>
  <main class="ah-book">
    <form class="ah-book-card" id="bookingForm">
      <ol class="ah-book-progress" id="bookProgress">
        <li><button type="button" data-goto="1">گوشی</button></li>
        <li><button type="button" data-goto="2">خدمات</button></li>
        <li><button type="button" data-goto="3">اطلاعات</button></li>
      </ol>

      <section data-step="1">
        <h2 class="ah-book-lead">برند گوشی</h2>
        <div class="ah-book-chips" id="brandRow"></div>
        <div id="modelBlock" hidden>
          <h2 class="ah-book-lead">مدل</h2>
          <div class="ah-book-chips" id="modelRow"></div>
        </div>
      </section>

      <section data-step="2" hidden>
        <p class="ah-book-picked" id="pickedDevice"></p>
        <h2 class="ah-book-lead">چه کاری لازم است؟</h2>
        <div class="ah-book-services" id="serviceRow"></div>
      </section>

      <section data-step="3" hidden>
        <p class="ah-book-picked" id="pickedJob"></p>
        <div class="ah-book-fields">
          <div>
            <label for="date">تاریخ</label>
            <input class="form-control" type="date" id="date" name="date" required>
          </div>
          <div>
            <label>ساعت</label>
            <div class="ah-slots" id="slots"></div>
            <input type="hidden" name="slot" id="slot">
            <div class="ah-book-note" id="capInfo"></div>
          </div>
          <div class="ah-book-split">
            <div>
              <label for="bookName">نام و نام خانوادگی</label>
              <input class="form-control" id="bookName" name="name" required autocomplete="name">
            </div>
            <div>
              <label for="bookPhone">شماره تماس</label>
              <input class="form-control" id="bookPhone" name="phone" required inputmode="tel" placeholder="09xxxxxxxxx" dir="ltr" autocomplete="tel">
            </div>
          </div>
          <div id="addressFields" hidden>
            <p class="ah-book-note">این کار در آدرس شما انجام می‌شود.</p>
            <label for="street">نشانی</label>
            <input class="form-control" name="street" id="street" placeholder="خیابان، کوچه" autocomplete="street-address">
            <div class="ah-book-split ah-book-split--3">
              <div>
                <label for="plaque">پلاک</label>
                <input class="form-control" name="plaque" id="plaque">
              </div>
              <div>
                <label for="unit">واحد</label>
                <input class="form-control" name="unit" id="unit" placeholder="طبقه ۲">
              </div>
              <div>
                <label for="postal">کد پستی</label>
                <input class="form-control" name="postal" id="postal" dir="ltr" inputmode="numeric">
              </div>
            </div>
          </div>
          <p class="ah-book-note" id="workshopNote" hidden>این خدمت در کارگاه انجام می‌شود و نیازی به آدرس نیست.</p>
          <div class="ah-book-price" id="priceBox">—</div>
          <details class="ah-book-more">
            <summary>توضیح، عکس یا کد تخفیف، اگر لازم است</summary>
            <label for="bookNotes">توضیح</label>
            <textarea class="form-control" id="bookNotes" name="notes" rows="2"></textarea>
            <label for="media">عکس یا ویدئو</label>
            <input class="form-control" type="file" id="media" accept="image/*,video/*">
            <label for="coupon">کد تخفیف</label>
            <input class="form-control" name="coupon" id="coupon">
          </details>
        </div>
      </section>

      <input type="hidden" name="serviceId" id="serviceId">
      <input type="hidden" name="deviceModel" id="deviceModel">

      <div class="ah-book-nav">
        <button class="ah-btn ah-btn-ghost" type="button" id="bookBack" hidden>مرحله قبل</button>
        <button class="ah-btn ah-btn-primary" type="button" id="bookNext">ادامه</button>
        <button class="ah-btn ah-btn-primary" type="submit" id="bookSubmit" hidden>ثبت درخواست</button>
      </div>
    </form>
    <div id="bookingResult"></div>
  </main>
  <div id="ah-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/payment.js"></script>
  <script src="../assets/js/sms.js"></script>
  <script src="../assets/js/workflow.js"></script>
  <script src="../assets/js/chatbot.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/booking.js"></script>
</body>
</html>
