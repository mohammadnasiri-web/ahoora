<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>رزرو نوبت | اهورا تل</title>
  <meta name="description" content="رزرو آنلاین تعویض باتری و خدمات تعمیرات با ظرفیت روزانه قابل مدیریت">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>
  <div id="ah-header"></div>
  <header class="ah-page-hero">
    <div class="container-ah">
      <h1>رزرو آنلاین</h1>
      <p>انتخاب خدمت، زمان و پرداخت — ظرفیت روزانه مستقل برای هر خدمت</p>
    </div>
  </header>
  <main class="container-ah py-4">
    <form class="ah-form-card" id="bookingForm" style="max-width:720px;margin:auto">
      <div class="row g-3">
        <div class="col-12">
          <label>نوع خدمت</label>
          <select class="form-select" id="serviceId" name="serviceId" required></select>
        </div>
        <div class="col-md-6">
          <label>برند / گروه مدل</label>
          <select class="form-select" id="modelGroup">
            <option value="iphone">آیفون</option>
            <option value="other">سایر برندها</option>
          </select>
        </div>
        <div class="col-md-6">
          <label>مدل گوشی *</label>
          <select class="form-select" id="deviceModel" name="deviceModel" required></select>
        </div>
        <div class="col-md-6">
          <label>تاریخ *</label>
          <input class="form-control" type="date" id="date" name="date" required>
        </div>
        <div class="col-md-6">
          <label>قیمت سرویس</label>
          <div class="form-control bg-white" id="priceBox">—</div>
        </div>
        <div class="col-12">
          <label>ساعت قابل رزرو</label>
          <div class="ah-slots" id="slots"></div>
          <input type="hidden" name="slot" id="slot" required>
          <div class="small text-secondary mt-1" id="capInfo"></div>
        </div>
        <div class="col-md-6">
          <label>نام و نام خانوادگی *</label>
          <input class="form-control" name="name" required>
        </div>
        <div class="col-md-6">
          <label>شماره تماس *</label>
          <input class="form-control" name="phone" required placeholder="09xxxxxxxxx" dir="ltr">
        </div>
        <div id="addressFields" class="col-12" hidden>
          <div class="row g-3">
            <div class="col-12"><label>نشانی کامل *</label><input class="form-control" name="street" id="street" placeholder="خیابان، کوچه، ..."></div>
            <div class="col-md-4"><label>پلاک *</label><input class="form-control" name="plaque" id="plaque"></div>
            <div class="col-md-4"><label>واحد / طبقه</label><input class="form-control" name="unit" id="unit" placeholder="طبقه ۲، واحد ۴"></div>
            <div class="col-md-4"><label>کد پستی</label><input class="form-control" name="postal" dir="ltr"></div>
          </div>
        </div>
        <div class="col-12">
          <label>توضیحات تکمیلی</label>
          <textarea class="form-control" name="notes" rows="2"></textarea>
        </div>
        <div class="col-12">
          <label>آپلود عکس یا ویدئو (اختیاری)</label>
          <input class="form-control" type="file" id="media" accept="image/*,video/*">
          <div class="small text-secondary">فایل به‌صورت محلی در مرورگر نگه‌داری می‌شود (پیش‌نمایش فرانت).</div>
        </div>
        <div class="col-md-6">
          <label>کد تخفیف</label>
          <input class="form-control" name="coupon" id="coupon">
        </div>
        <div class="col-12">
          <button class="ah-btn ah-btn-primary w-100" type="submit">ثبت درخواست برای تأیید</button>
        </div>
      </div>
    </form>
    <div id="bookingResult" class="mt-4" style="max-width:720px;margin:auto"></div>
  </main>
  <div id="ah-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/payment.js"></script>
  <script src="../assets/js/sms.js"></script>
  <script src="../assets/js/workflow.js"></script>
  <script src="../assets/js/chatbot.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/booking.js"></script>
</body>
</html>
