<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فروشگاه | اهورا تل</title>
  <meta name="description" content="خرید گوشی، لوازم جانبی و قطعات موبایل از اهورا تل">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>
  <div id="ah-header"></div>
  <div id="ah-promo"></div>
  <header class="ah-page-hero">
    <div class="container-ah">
      <h1>فروشگاه</h1>
      <p>گوشی، لوازم جانبی و قطعات — با گارانتی و ارسال سریع</p>
    </div>
  </header>
  <main class="container-ah py-4">
    <div class="row g-4">
      <aside class="col-lg-3">
        <form class="ah-filters" id="filterForm">
          <label class="form-label">جست‌وجو</label>
          <input class="form-control mb-3" name="q" id="fQ" placeholder="نام، برند، مدل">
          <label class="form-label">دسته‌بندی</label>
          <select class="form-select mb-3" name="cat" id="fCat"></select>
          <label class="form-label">برند</label>
          <select class="form-select mb-3" name="brand" id="fBrand"><option value="">همه</option></select>
          <label class="form-label">مرتب‌سازی</label>
          <select class="form-select mb-3" name="sort" id="fSort">
            <option value="">پیش‌فرض</option>
            <option value="price-asc">ارزان‌ترین</option>
            <option value="price-desc">گران‌ترین</option>
            <option value="newest">جدیدترین</option>
          </select>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="fStock" name="inStock">
            <label class="form-check-label" for="fStock">فقط موجود</label>
          </div>
          <button class="ah-btn ah-btn-primary w-100" type="submit">اعمال فیلتر</button>
        </form>
      </aside>
      <section class="col-lg-9">
        <div id="shopResultMeta" class="mb-3 text-secondary small"></div>
        <div class="ah-grid" id="shopGrid"></div>
      </section>
    </div>
  </main>
  <div id="ah-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/seed.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/chatbot.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/shop.js"></script>
</body>
</html>
